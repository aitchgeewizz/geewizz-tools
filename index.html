<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geewizz Tools</title>
<meta name="description" content="A small set of single-purpose tools for everyday workflow snags. Open source, no sign-up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  a { color: inherit; }

  /* Corner chrome, as on the portfolio */
  .top {
    display: flex;
    justify-content: flex-end;
    gap: 28px;
    padding: 32px 40px 0;
  }
  .top a { text-decoration: none; }
  .top a:hover { color: var(--ink); }
  .top .on { color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
  .top .on::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink);
  }

  /* Wordmark */
  .mark {
    padding: 2vw 40px 0;
    font-weight: 500;
    font-size: clamp(120px, 24vw, 360px);
    line-height: 0.82;
    letter-spacing: -0.045em;
    background: var(--foil);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    user-select: none;
  }

  .intro {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding: 28px 40px 48px;
  }
  .intro p {
    font-size: 18px;
    line-height: 1.45;
    max-width: 440px;
    color: var(--ink);
  }

  /* Tools */
  .list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    padding: 0 40px;
  }

  .tool {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 240px;
    padding: 24px 24px 22px;
    background: var(--bg-card);
    border-radius: 4px;
    box-shadow: var(--shadow);
    text-decoration: none;
    transition: transform 0.45s var(--ease-spring), box-shadow 0.45s var(--ease-smooth);
  }
  .tool:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lift);
  }
  .tool:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }

  .tool .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  /* the black square endpoint from the portfolio's connectors */
  .tool .head .label::before {
    content: '';
    display: inline-block;
    width: 7px; height: 7px;
    margin-right: 10px;
    background: var(--ink);
    vertical-align: 1px;
    transition: background 0.3s var(--ease-smooth);
  }
  .tool:hover .head .label::before { background: var(--signal); }

  .tool .arrow {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-faint);
    transition: transform 0.45s var(--ease-spring), color 0.3s;
  }
  .tool:hover .arrow { transform: translate(3px, -3px); color: var(--ink); }

  .tool .name {
    margin-top: auto;
    font-size: 44px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.045em;
    text-transform: lowercase;
  }

  .tool .description {
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink-soft);
    max-width: 34ch;
  }

  .tool .tags { display: flex; gap: 14px; }
  .tool .tags .label { color: var(--ink-faint); font-size: 10px; }

  footer {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    padding: 72px 40px 32px;
  }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 720px) {
    .top, .mark, .intro, .list, footer { padding-left: 16px; padding-right: 16px; }
    .intro { flex-direction: column; }
    .list { grid-template-columns: 1fr; }
    footer { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tool, .tool .arrow { transition: none; }
    .tool:hover { transform: none; }
    .tool:hover .arrow { transform: none; }
  }
</style>
</head>
<body>

<nav class="top">
  <span class="label on">Tools</span>
  <a class="label" href="https://github.com/aitchgeewizz/geewizz-tools">GitHub</a>
</nav>

<h1 class="mark" aria-label="Geewizz tools">tools</h1>

<section class="intro">
  <p>A small set of single-purpose tools for everyday workflow snags.</p>
  <span class="label">Open source · no sign-up</span>
</section>

<main class="list" id="list"></main>

<footer>
  <span class="label">Hannah Gibson — Brand designer &amp; tinkerer</span>
  <a class="label" href="https://github.com/aitchgeewizz/geewizz-tools">Fork it on GitHub ↗</a>
</footer>

<script>
  const TOOLS = [
    {
      name: "Squish",
      href: "/tools/squish",
      description: "Drag images in, get small ones out. Compress before emailing or uploading.",
      tags: ["image", "local-only"]
    },
    {
      name: "Reel",
      href: "/tools/reel",
      description: "Drop images, MP4s or GIFs. Sequence them, time them, get a looping GIF or an MP4.",
      tags: ["image", "video", "local-only"]
    },
    {
      name: "Transcript",
      href: "/tools/transcript",
      description: "Paste a video, podcast, article or PDF link. Get the text and a summary. Copy it or send it to Notion.",
      tags: ["text", "research", "passcode"]
    },
    {
      name: "Ask",
      href: "/tools/ask",
      description: "Ask a question of your Research library in Notion. Answers cite the videos, podcasts and articles you saved.",
      tags: ["text", "research", "passcode"]
    }
  ];

  const list = document.getElementById('list');

  TOOLS.forEach((tool, i) => {
    const el = document.createElement('a');
    el.className = 'tool';
    el.href = tool.href;
    el.innerHTML = `
      <div class="head">
        <span class="label">${String(i + 1).padStart(2, '0')}</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </div>
      <div class="name">${tool.name}</div>
      <div class="description">${tool.description}</div>
      <div class="tags">${tool.tags.map(t => `<span class="label">${t}</span>`).join('')}</div>
    `;
    list.appendChild(el);
  });
</script>

</body>
</html>
